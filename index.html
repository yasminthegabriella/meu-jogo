<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111c2b">
  <title>RUA DE CASA — uma aventura felina</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800;900&display=swap');
    :root { color-scheme: dark; --ink:#eff4ed; --muted:#9daeb5; --mint:#a4f0cb; --coral:#ff9272; --night:#111c2b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; overflow:hidden; background:#111c2b; color:var(--ink); font-family:'Nunito',sans-serif; }
    .game { position:relative; display:grid; grid-template-rows:auto 1fr; width:100%; height:100svh; min-height:440px; padding:clamp(12px,2vw,24px); gap:12px; }
    header { z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:1500px; width:100%; margin:auto; padding:0 2px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { display:grid; place-items:center; width:40px; height:40px; border:1px solid #426458; border-radius:13px; background:#1b342f; font-size:22px; }
    .brand-name { font-size:14px; font-weight:900; letter-spacing:1.4px; }
    .brand-sub { margin-top:2px; color:#9daeb5; font:10px 'DM Mono',monospace; letter-spacing:1.1px; }
    .hud { display:flex; align-items:center; gap:10px; }
    .counter,.sound { display:flex; align-items:center; justify-content:center; min-height:40px; border:1px solid #334450; border-radius:12px; background:#1a2936; }
    .counter { gap:9px; padding:0 13px; color:#d4e5d9; font:12px 'DM Mono',monospace; }
    .counter b { color:var(--mint); font-size:14px; }
    .sound { width:40px; color:var(--ink); font-size:17px; cursor:pointer; }
    .sound:hover { border-color:#a4f0cb; }
    .stage { position:relative; width:min(100%,1500px); height:100%; min-height:0; margin:0 auto; overflow:hidden; border:1px solid #425460; border-radius:18px; background:#172431; box-shadow:0 20px 70px #07111b88; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .hint { position:absolute; bottom:16px; left:50%; display:flex; align-items:center; gap:8px; transform:translateX(-50%); padding:9px 13px; border:1px solid #394b55; border-radius:10px; background:#111c2be8; color:#cad4ce; font:10px 'DM Mono',monospace; white-space:nowrap; pointer-events:none; }
    .challenge-hud { position:absolute; top:14px; left:14px; z-index:2; display:flex; gap:7px; pointer-events:none; }
    .challenge-hud span { display:grid; place-items:center; min-width:48px; min-height:34px; padding:0 9px; border:1px solid #51605d; border-radius:9px; background:#111c2be8; color:#ff9b8b; font:13px 'DM Mono',monospace; }
    .challenge-hud span:last-child { color:#f1e4b0; }
    .challenge-hud .urgent { color:#ff796e; }
    .key { padding:3px 5px; border:1px solid #5b6b6e; border-radius:4px; color:#fff; }
    .overlay { position:absolute; inset:0; z-index:3; display:grid; place-items:center; padding:20px; background:#101b2bc2; backdrop-filter:blur(7px); }
    .overlay[hidden] { display:none; }
    .dialog { width:min(420px,100%); padding:clamp(22px,5vw,38px); border:1px solid #50625e; border-radius:18px; background:#172630; box-shadow:0 20px 80px #08101999; text-align:center; animation:arrive .55s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes arrive { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
    .cat-icon { display:grid; place-items:center; width:78px; height:78px; margin:0 auto 14px; border:1px solid #765139; border-radius:25px; background:#332a27; font-size:46px; }
    .eyebrow { color:var(--mint); font:10px 'DM Mono',monospace; letter-spacing:2px; }
    h1 { margin:8px 0 10px; font-size:clamp(27px,7vw,36px); line-height:1.08; font-weight:900; }
    .dialog p { margin:0 auto 22px; max-width:320px; color:#bbc8c3; font-size:14px; line-height:1.6; }
    .primary { width:100%; min-height:48px; border:0; border-radius:10px; background:var(--mint); color:#14251f; font:900 14px 'Nunito',sans-serif; cursor:pointer; transition:transform .16s,background .16s; }
    .primary:hover { transform:translateY(-2px); background:#c3ffdf; }
    .mobile-controls { position:absolute; inset:auto 13px 12px; display:none; justify-content:space-between; align-items:end; pointer-events:none; }
    .pad { display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,42px); gap:4px; pointer-events:auto; }
    .pad button,.meow { display:grid; place-items:center; border:1px solid #81908d99; border-radius:10px; background:#16242dcc; color:white; font-size:17px; touch-action:none; user-select:none; }
    .pad button:active,.meow:active { background:#486454; }
    .pad .up { grid-column:2; }.pad .left { grid-column:1; grid-row:2; }.pad .down { grid-column:2; grid-row:2; }.pad .right { grid-column:3; grid-row:2; }
    .meow { width:54px; height:48px; font-size:22px; pointer-events:auto; }
    @media (pointer:coarse), (max-width:700px) {
      .game { grid-template-rows:auto 1fr; gap:8px; padding:10px; }
      header { min-height:39px; }.brand-mark { width:34px;height:34px; }.brand-name { font-size:12px; }.brand-sub { font-size:9px; }
      .counter,.sound { min-height:35px; }.sound { width:35px; }.counter { padding:0 9px;font-size:10px; }
      .stage { border-radius:13px; }.mobile-controls { display:flex; }.hint { bottom:112px; font-size:9px; }.challenge-hud { top:9px;left:9px; }.challenge-hud span { min-width:42px;min-height:30px;font-size:11px; }
    }
    @media (max-height:540px) { .game { padding:8px; gap:6px; }.brand-mark { width:30px;height:30px; }.counter,.sound { min-height:32px; }.hint { display:none; } }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div class="brand"><div class="brand-mark">🐾</div><div><div class="brand-name">RUA DE CASA</div><div class="brand-sub">DIÁRIO DE UM GATO PERDIDO</div></div></div>
      <div class="hud"><div class="counter">LEMBRANÇAS <b id="count">0 / 3</b></div><button class="sound" id="sound" aria-label="Ativar música e efeitos" title="Ativar música e efeitos">♪</button></div>
    </header>
    <section class="stage" aria-label="Jogo Rua de Casa">
      <canvas id="scene" aria-label="Cidade futurista. Use as setas para encontrar o caminho de casa."></canvas>
      <div class="challenge-hud" aria-live="polite"><span aria-label="Vidas restantes"><b id="lives">♥♥♥</b></span><span aria-label="Tempo restante"><b id="clock">75s</b></span></div>
      <div class="hint"><span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span><span>·</span> DESVIE DOS DRONES</div>
      <div class="mobile-controls" aria-label="Controles de movimento">
        <div class="pad"><button class="up" data-dir="up" aria-label="Mover para cima">↑</button><button class="left" data-dir="left" aria-label="Mover para esquerda">←</button><button class="down" data-dir="down" aria-label="Mover para baixo">↓</button><button class="right" data-dir="right" aria-label="Mover para direita">→</button></div>
        <button class="meow" id="meow" aria-label="Miar" title="Miar">♡</button>
      </div>
      <div class="overlay" id="overlay">
        <div class="dialog"><div class="cat-icon" id="catIcon">🐈</div><div class="eyebrow" id="eyebrow">UMA AVENTURA PEQUENINA</div><h1 id="title">Um caminho<br>chamado casa.</h1><p id="message">Encontre as 3 lembranças e volte para casa em 75 segundos. Desvie dos drones: três colisões encerram a busca.</p><button class="primary" id="start">Ajudar Mimi a voltar</button></div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#scene');
      const ctx = canvas.getContext('2d');
      const overlay = document.querySelector('#overlay');
      const countLabel = document.querySelector('#count');
      const keys = new Set();
      const world = { w: 1200, h: 780 };
      const cat = { x: 270, y: 630, vx: 0, vy: 0, face: 1 };
      const home = { x: 854, y: 230 };
      const entrance = { x: home.x, y: home.y + 20 };
      const memories = [{x:270,y:580,got:false},{x:797,y:300,got:false},{x:1002,y:475,got:false}];
      const drones = [
        {axis:'x',fixed:245,min:292,max:800,speed:112,offset:0},
        {axis:'x',fixed:519,min:292,max:980,speed:138,offset:310},
        {axis:'y',fixed:797,min:274,max:532,speed:82,offset:125}
      ];
      const blocks = [
        {x:28,y:28,w:215,h:180,c:'#243c43',roof:'#31545a',label:'LOJA 24H',name:'Estrela 24h · Mercado'},
        {x:285,y:34,w:280,h:150,c:'#293443',roof:'#46505c',label:'NEON NOODLES',name:'Cometa Ramen · Restaurante'},
        {x:610,y:20,w:225,h:185,c:'#1c4144',roof:'#24635e',label:'JARDIM VERTICAL',name:'Jardins Suspensos · Jardim vertical'},
        {x:880,y:24,w:285,h:176,c:'#333441',roof:'#515063',label:'TORRE LUMEN',name:'Farol de Néon · Torre'},
        {x:30,y:290,w:220,h:205,c:'#343443',roof:'#4b4c61',label:'ARCADE',name:'Pixelária · Arcade'},
        {x:292,y:260,w:180,h:190,c:'#263b45',roof:'#355961',label:'CAFÉ COMETA',name:'Café Via Láctea · Cafeteria'},
        {x:512,y:275,w:260,h:215,c:'#2e3940',roof:'#465353',label:'ESTAÇÃO',name:'Plataforma Pulso · Estação de trem'},
        {x:810,y:260,w:175,h:205,c:'#253e42',roof:'#35615b',label:'FLORICULTURA',name:'Flor de Lua · Floricultura'},
        {x:1020,y:265,w:150,h:215,c:'#3a3540',roof:'#594c58',label:'HOTEL',name:'Pouso Estelar · Hotel'},
        {x:30,y:555,w:210,h:195,c:'#233b43',roof:'#315b60',label:'LAVANDERIA',name:'Lava-Lume · Lavanderia'},
        {x:300,y:520,w:215,h:220,c:'#383441',roof:'#564b60',label:'CLUBE 8-BIT',name:'Clube Nível 8 · Fliperama'},
        {x:570,y:550,w:240,h:200,c:'#273c3b',roof:'#386252',label:'ESTUFA',name:'Lua Verde · Estufa'},
        {x:855,y:540,w:310,h:210,c:'#343343',roof:'#4e4b60',label:'OBSERVATÓRIO',name:'Olho do Cosmos · Observatório'}
      ];
      let active=false, last=0, elapsed=0, soundOn=false, audio, musicBus, musicTimer=null, lives=3, timeLeft=75, hitCooldown=0;
      const livesLabel=document.querySelector('#lives');
      const clockLabel=document.querySelector('#clock');
      let view={x:0,y:0,w:1200,h:780};

      function resize(){
        const rect=canvas.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
        canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        const aspect=rect.width/rect.height;
        view.w=Math.min(world.w,Math.max(760,world.h*aspect)); view.h=view.w/aspect;
        if(view.h>world.h){view.h=world.h;view.w=view.h*aspect;}
      }
      function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
      function drawLocalArt(label,x,y,maxWidth,maxHeight){
        const pale='#e7e7d5',accent=label==='CAFÉ COMETA'?'#a4f0cb':label==='JARDIM VERTICAL'||label==='ESTUFA'||label==='FLORICULTURA'?'#92c884':'#ffad79';
        const artBounds={'LOJA 24H':[42,39],'NEON NOODLES':[38,36],'JARDIM VERTICAL':[32,34],'FLORICULTURA':[32,34],'TORRE LUMEN':[28,53],'ARCADE':[42,37],'CAFÉ COMETA':[35,42],'ESTAÇÃO':[46,39],'HOTEL':[44,36],'LAVANDERIA':[36,40],'CLUBE 8-BIT':[44,32],'ESTUFA':[42,36],'OBSERVATÓRIO':[44,46]};
        const [artWidth,artHeight]=artBounds[label]||[44,46],scale=Math.min(maxWidth/artWidth,maxHeight/artHeight);
        ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.strokeStyle=pale;ctx.fillStyle=accent;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
        if(label==='LOJA 24H'){
          rounded(-16,-7,32,24,3,'#d7c89c');ctx.fillStyle=accent;ctx.beginPath();ctx.moveTo(-18,-7);ctx.lineTo(-14,-16);ctx.lineTo(14,-16);ctx.lineTo(18,-7);ctx.closePath();ctx.fill();ctx.strokeStyle=pale;ctx.stroke();
          ctx.fillStyle='#273942';ctx.fillRect(-11,-3,8,8);ctx.fillRect(4,3,8,14);ctx.strokeStyle=pale;ctx.strokeRect(-11,-3,8,8);
        }else if(label==='NEON NOODLES'){
          ctx.beginPath();ctx.moveTo(-17,-1);ctx.quadraticCurveTo(-14,16,0,16);ctx.quadraticCurveTo(14,16,17,-1);ctx.stroke();ctx.beginPath();ctx.moveTo(-17,-1);ctx.lineTo(17,-1);ctx.stroke();
          ctx.beginPath();ctx.moveTo(-9,-4);ctx.quadraticCurveTo(-13,-10,-8,-14);ctx.moveTo(0,-4);ctx.quadraticCurveTo(-4,-10,1,-16);ctx.moveTo(8,-4);ctx.quadraticCurveTo(4,-10,9,-14);ctx.stroke();
          ctx.strokeStyle='#f2d58d';ctx.beginPath();ctx.moveTo(-5,-1);ctx.quadraticCurveTo(0,4,5,-1);ctx.stroke();
        }else if(label==='JARDIM VERTICAL'||label==='FLORICULTURA'){
          for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*10,11);ctx.lineTo(i*9,0);ctx.stroke();ctx.beginPath();ctx.ellipse(i*9-5,-2,5,2.8,-.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(i*9+5,5,5,2.8,.5,0,Math.PI*2);ctx.fill();}
          if(label==='FLORICULTURA')for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*10,-8,4,0,Math.PI*2);ctx.fill();}
          ctx.fillStyle='#887866';ctx.beginPath();ctx.moveTo(-14,12);ctx.lineTo(14,12);ctx.lineTo(10,18);ctx.lineTo(-10,18);ctx.closePath();ctx.fill();
        }else if(label==='TORRE LUMEN'){
          rounded(-11,-18,22,38,3,'#65677a');ctx.strokeStyle=pale;ctx.strokeRect(-11,-18,22,38);ctx.fillStyle='#f2d58d';
          for(let row=0;row<3;row++)for(let col=0;col<2;col++)ctx.fillRect(-7+col*10,-12+row*9,4,4);
          ctx.strokeStyle=accent;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(0,-25);ctx.stroke();ctx.beginPath();ctx.arc(0,-27,2,0,Math.PI*2);ctx.fill();
        }else if(label==='ARCADE'){
          for(let i=0;i<2;i++){const left=-18+i*21;rounded(left,-15,17,32,3,'#e98a78');rounded(left+3,-11,11,10,2,'#293946');ctx.fillStyle='#9cd5ce';ctx.fillRect(left+5,-8,7,4);ctx.fillStyle='#f2d58d';ctx.beginPath();ctx.arc(left+11,3,2,0,Math.PI*2);ctx.fill();ctx.fillRect(left+5,7,5,7);}
        }else if(label==='CAFÉ COMETA'){
          ctx.beginPath();ctx.moveTo(-12,-8);ctx.lineTo(10,-8);ctx.lineTo(8,12);ctx.quadraticCurveTo(0,17,-9,12);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(11,0,5,-Math.PI/2,Math.PI/2);ctx.stroke();
          ctx.strokeStyle=pale;ctx.beginPath();ctx.moveTo(-6,-12);ctx.quadraticCurveTo(-10,-17,-5,-21);ctx.moveTo(4,-12);ctx.quadraticCurveTo(0,-17,5,-21);ctx.stroke();ctx.beginPath();ctx.moveTo(-13,16);ctx.lineTo(13,16);ctx.stroke();
        }else if(label==='ESTAÇÃO'){
          rounded(-19,-13,38,28,6,'#e7e7d5');ctx.fillStyle='#63a5a1';rounded(-13,-8,10,10,2,ctx.fillStyle);rounded(3,-8,10,10,2,ctx.fillStyle);
          ctx.fillStyle='#f2d58d';ctx.beginPath();ctx.arc(-11,9,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(11,9,2,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle=pale;ctx.beginPath();ctx.moveTo(-21,18);ctx.lineTo(21,18);ctx.moveTo(-18,22);ctx.lineTo(18,22);ctx.stroke();
        }else if(label==='HOTEL'){
          ctx.strokeRect(-19,-15,38,30);ctx.fillStyle='#d7c89c';ctx.fillRect(-15,5,30,9);ctx.fillRect(-15,0,10,6);ctx.fillStyle=accent;ctx.fillRect(-14,2,8,4);
          ctx.strokeStyle=pale;ctx.beginPath();ctx.moveTo(-20,16);ctx.lineTo(20,16);ctx.stroke();
        }else if(label==='LAVANDERIA'){
          rounded(-16,-18,32,36,4,'#91b9b6');ctx.strokeStyle=pale;ctx.strokeRect(-16,-18,32,36);ctx.fillStyle='#263943';ctx.beginPath();ctx.arc(0,3,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d8e4d8';ctx.stroke();ctx.beginPath();ctx.arc(0,3,6,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#f2d58d';ctx.beginPath();ctx.arc(9,-12,1.5,0,Math.PI*2);ctx.fill();
        }else if(label==='CLUBE 8-BIT'){
          rounded(-20,-14,40,28,7,'#a7a0d0');ctx.strokeStyle=pale;ctx.strokeRect(-20,-14,40,28);ctx.fillStyle='#283541';rounded(-12,-9,24,18,3,ctx.fillStyle);
          ctx.strokeStyle='#a4f0cb';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-7,-3);ctx.lineTo(-7,5);ctx.moveTo(-11,1);ctx.lineTo(-3,1);ctx.stroke();ctx.fillStyle='#ff9272';ctx.beginPath();ctx.arc(7,-2,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(10,4,2.5,0,Math.PI*2);ctx.fill();
        }else if(label==='ESTUFA'){
          ctx.strokeStyle=pale;ctx.beginPath();ctx.moveTo(-19,14);ctx.lineTo(-19,-5);ctx.lineTo(0,-18);ctx.lineTo(19,-5);ctx.lineTo(19,14);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(0,14);ctx.moveTo(-18,-3);ctx.lineTo(18,-3);ctx.moveTo(-18,7);ctx.lineTo(18,7);ctx.stroke();
          ctx.fillStyle='#91c982';for(const px of [-11,8]){ctx.beginPath();ctx.ellipse(px,11,4,2,0,0,Math.PI*2);ctx.fill();}
        }else if(label==='OBSERVATÓRIO'){
          ctx.strokeStyle=pale;ctx.beginPath();ctx.moveTo(-14,17);ctx.lineTo(0,-4);ctx.lineTo(15,17);ctx.moveTo(0,-4);ctx.lineTo(0,18);ctx.stroke();
          ctx.save();ctx.rotate(-.55);rounded(-5,-19,10,24,3,'#a7d5ce');ctx.strokeStyle=pale;ctx.strokeRect(-5,-19,10,24);ctx.fillStyle='#f2d58d';ctx.beginPath();ctx.arc(0,-19,6,Math.PI,0);ctx.fill();ctx.restore();
          ctx.fillStyle='#f2d58d';ctx.beginPath();ctx.arc(18,-13,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-18,-8,1.5,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }
      function drawBlock(b,i){
        ctx.fillStyle='#101a25';ctx.fillRect(b.x+8,b.y+12,b.w,b.h);
        const roofX=b.x+8,roofY=b.y+8,roofW=b.w-16,roofH=b.h-30,centerX=b.x+b.w/2;
        rounded(b.x,b.y,b.w,b.h,8,b.c); rounded(roofX,roofY,roofW,roofH,5,b.roof);
        ctx.fillStyle='#dce5ca';ctx.globalAlpha=.13;
        for(let x=b.x+18;x<b.x+b.w-20;x+=27) for(let y=b.y+20;y<b.y+b.h-35;y+=25) ctx.fillRect(x,y,13,10);
        ctx.globalAlpha=1;
        if(['JARDIM VERTICAL','ESTUFA','FLORICULTURA'].includes(b.label)){
          for(let row=0;row<3;row++){ctx.fillStyle=row%2?'#78a77b':'#8dbb83';ctx.globalAlpha=.8;rounded(roofX+12,roofY+18+row*18,roofW-24,9,3,ctx.fillStyle);ctx.globalAlpha=1;}
          ctx.fillStyle='#c9dfaa';for(let x=roofX+22;x<roofX+roofW-16;x+=32){ctx.beginPath();ctx.arc(x,roofY+21,2,0,Math.PI*2);ctx.fill();}
        }
        if(b.label==='TORRE LUMEN'){
          rounded(centerX-34,roofY+12,68,roofH-22,5,'#55566a');
          for(let y=roofY+21;y<roofY+roofH-20;y+=16){ctx.fillStyle='#e8cb8b';ctx.globalAlpha=.72;ctx.fillRect(centerX-19,y,8,6);ctx.fillRect(centerX+11,y,8,6);ctx.globalAlpha=1;}
          ctx.strokeStyle='#d3bd84';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(centerX,roofY+12);ctx.lineTo(centerX,roofY-2);ctx.stroke();
        }
        if(b.label==='OBSERVATÓRIO'){
          ctx.fillStyle='#697778';ctx.beginPath();ctx.arc(centerX,roofY+roofH*.62,Math.min(31,roofW*.14),Math.PI,0);ctx.fill();
          ctx.fillStyle='#a7d5ce';ctx.globalAlpha=.62;ctx.fillRect(centerX-31,roofY+roofH*.62,62,5);ctx.globalAlpha=1;
          ctx.strokeStyle='#b5c9b0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(centerX,roofY+15);ctx.lineTo(centerX+26,roofY+5);ctx.stroke();
        }
        if(b.label==='ESTAÇÃO'){
          ctx.fillStyle='#89928a';rounded(roofX+22,roofY+roofH/2-10,roofW-44,20,4,ctx.fillStyle);
          ctx.strokeStyle='#d4c791';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(roofX+29,roofY+roofH/2);ctx.lineTo(roofX+roofW-29,roofY+roofH/2);ctx.stroke();
          ctx.fillStyle='#dce5ca';ctx.fillRect(centerX-3,roofY+roofH/2-4,6,8);
        }
        if(['ARCADE','CLUBE 8-BIT'].includes(b.label)){
          for(let column=0;column<4;column++){ctx.fillStyle=['#ee8976','#f0cc7e','#81c3b2','#a5a0d0'][column];ctx.globalAlpha=.9;ctx.fillRect(roofX+18+column*25,roofY+21,16,20);ctx.globalAlpha=1;ctx.fillStyle='#24313a';ctx.fillRect(roofX+21+column*25,roofY+25,10,8);ctx.fillRect(roofX+24+column*25,roofY+36,4,2);}
        }
        drawLocalArt(b.label,centerX,roofY+roofH/2-5,roofW-20,roofH-28);
        ctx.fillStyle='#d9e0cb';ctx.font='8px "DM Mono",monospace';ctx.textAlign='center';ctx.fillText(b.name,centerX,b.y+b.h-9);
        if(i%3===0){ctx.fillStyle='#f4a078';ctx.globalAlpha=.68;ctx.fillRect(b.x+18,b.y+b.h-23,13,3);ctx.globalAlpha=1;}
      }
      function drawCity(t){
        const g=ctx.createLinearGradient(0,0,world.w,world.h);g.addColorStop(0,'#202f3a');g.addColorStop(.55,'#26363b');g.addColorStop(1,'#202d3b');ctx.fillStyle=g;ctx.fillRect(0,0,world.w,world.h);
        ctx.fillStyle='#334145';ctx.fillRect(0,220,world.w,50);ctx.fillRect(0,495,world.w,48);ctx.fillRect(260,0,27,world.h);ctx.fillRect(485,0,25,world.h);ctx.fillRect(785,0,24,world.h);ctx.fillRect(990,0,24,world.h);
        ctx.strokeStyle='#c7ba83';ctx.lineWidth=2;ctx.setLineDash([14,15]);ctx.globalAlpha=.45;
        [244,519].forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke();});
        [273,497,797,1002].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke();});ctx.setLineDash([]);ctx.globalAlpha=1;
        for(let x=15;x<world.w;x+=72){for(const y of [212,270,487,543]){ctx.fillStyle='#ec8f75';ctx.globalAlpha=.5;ctx.fillRect(x,y,24,2);ctx.globalAlpha=1;}}
        blocks.forEach(drawBlock);
        for(let i=0;i<14;i++){const x=18+(i*97)%1160,y=20+(i*163)%735;if(blocks.some(b=>x>b.x-12&&x<b.x+b.w+12&&y>b.y-12&&y<b.y+b.h+12))continue;drawPlant(x,y,t,i);}
        drawHome(t);
      }
      function drawPlant(x,y,t,i){ctx.fillStyle='#101a20';ctx.beginPath();ctx.ellipse(x,y+8,10,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=i%2?'#69a785':'#80b47b';ctx.beginPath();ctx.arc(x,y,5+Math.sin(t+i)*.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b9cd86';ctx.beginPath();ctx.arc(x-4,y-2,2,0,Math.PI*2);ctx.fill();}
      function drawHome(t){
        ctx.save();ctx.translate(home.x,home.y);
        const foundAll=memories.every(memory=>memory.got);
        ctx.globalAlpha=foundAll?.1+Math.sin(t*2)*.025:.025+Math.sin(t*2)*.008;ctx.fillStyle='#d3bd84';ctx.beginPath();ctx.arc(0,0,38,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        ctx.fillStyle=foundAll?'#526354':'#34473f';ctx.beginPath();ctx.moveTo(-35,-8);ctx.lineTo(0,-38);ctx.lineTo(35,-8);ctx.closePath();ctx.fill();
        rounded(-28,-9,56,43,4,foundAll?'#a18b70':'#716e63');rounded(-8,10,16,24,3,'#42534b');
        ctx.fillStyle=foundAll?'#c4b68c':'#827f70';ctx.fillRect(-21,2,8,8);ctx.fillRect(13,2,8,8);
        if(foundAll){ctx.globalAlpha=.6+Math.sin(t*3)*.15;ctx.fillStyle='#d3bd84';ctx.beginPath();ctx.arc(0,22,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
        if(foundAll){ctx.globalAlpha=.75;ctx.fillStyle='#d3bd84';ctx.font='9px "DM Mono",monospace';ctx.textAlign='center';ctx.fillText('CASA',0,52);ctx.globalAlpha=1;}
        ctx.globalAlpha=foundAll?.72:.18;ctx.fillStyle='#c4a76e';ctx.beginPath();ctx.arc(0,-40+Math.sin(t*2)*3,3,0,Math.PI*2);ctx.fill();ctx.restore();
      }
      function drawMemory(m,t){if(m.got)return;ctx.save();ctx.translate(m.x,m.y+Math.sin(t*2.5+m.x)*5);ctx.globalAlpha=.16;ctx.fillStyle='#a4f0cb';ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#a4f0cb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-10);ctx.bezierCurveTo(-14,-18,-17,2,0,12);ctx.bezierCurveTo(17,2,14,-18,0,-10);ctx.stroke();ctx.fillStyle='#d7ffe7';ctx.beginPath();ctx.arc(-3,-3,2,0,Math.PI*2);ctx.fill();ctx.restore();}
      function dronePosition(drone,t){const distance=drone.speed*t+drone.offset,span=drone.max-drone.min,phase=distance%(span*2),travel=phase<=span?phase:span*2-phase;return drone.axis==='x'?{x:drone.min+travel,y:drone.fixed}:{x:drone.fixed,y:drone.min+travel};}
      function drawDrone(drone,t){const p=dronePosition(drone,t);ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=.18+Math.sin(t*5+p.x)*.06;ctx.fillStyle='#ff806d';ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#ef8a76';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.stroke();rounded(-9,-6,18,12,4,'#d9ded0');ctx.fillStyle='#f16e65';ctx.fillRect(-5,-2,3,3);ctx.fillRect(2,-2,3,3);ctx.strokeStyle='#d9ded0';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-17,Math.sin(t*9)*4);ctx.moveTo(12,0);ctx.lineTo(17,Math.sin(t*9+1)*4);ctx.stroke();ctx.restore();}
      function drawCat(t){
        ctx.save();ctx.translate(cat.x,cat.y+Math.sin(t*9)*1.5);if(cat.face<0)ctx.scale(-1,1);
        ctx.fillStyle='#11192266';ctx.beginPath();ctx.ellipse(0,13,16,6,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff1df';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,4);ctx.quadraticCurveTo(-24,0,-19,-12);ctx.stroke();ctx.strokeStyle='#292a30';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-18,-8);ctx.quadraticCurveTo(-24,-1,-16,1);ctx.stroke();ctx.strokeStyle='#dc824c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-19,-12);ctx.lineTo(-20,-15);ctx.stroke();
        rounded(-12,-9,23,20,8,'#fff1df');ctx.fillStyle='#292a30';ctx.beginPath();ctx.ellipse(-7,-2,4,8,-.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dc824c';ctx.beginPath();ctx.ellipse(5,0,5,7,.35,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff1df';ctx.beginPath();ctx.arc(8,-11,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#292a30';ctx.beginPath();ctx.moveTo(1,-19);ctx.lineTo(3,-30);ctx.lineTo(11,-20);ctx.fill();ctx.fillStyle='#dc824c';ctx.beginPath();ctx.moveTo(13,-20);ctx.lineTo(21,-27);ctx.lineTo(20,-15);ctx.fill();ctx.beginPath();ctx.ellipse(8,-19,5,3,.3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#547b54';ctx.beginPath();ctx.ellipse(12,-12,1.6,2.8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(20,-12,1.6,2.8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d87573';ctx.beginPath();ctx.arc(16,-7,2,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff1df';ctx.lineWidth=3;for(const x of [-7,7]){ctx.beginPath();ctx.moveTo(x,8);ctx.lineTo(x,12+Math.sin(t*10+x)*2);ctx.stroke();}ctx.strokeStyle='#292a30';ctx.beginPath();ctx.moveTo(-7,9);ctx.lineTo(-7,12+Math.sin(t*10-7)*2);ctx.stroke();
        ctx.restore();
      }
      function frame(now){
        const dt=Math.min((now-last)/1000||0,.04);last=now;elapsed+=dt;
        if(active){timeLeft=Math.max(0,timeLeft-dt);clockLabel.textContent=`${Math.ceil(timeLeft)}s`;clockLabel.classList.toggle('urgent',timeLeft<=15);hitCooldown=Math.max(0,hitCooldown-dt);if(timeLeft===0){gameOver('time');}else{let dx=0,dy=0;if(keys.has('arrowleft'))dx--;if(keys.has('arrowright'))dx++;if(keys.has('arrowup'))dy--;if(keys.has('arrowdown'))dy++;
          const length=Math.hypot(dx,dy)||1;dx=dx/length*175*dt;dy=dy/length*175*dt;if(dx)cat.face=Math.sign(dx);
          const nextX=cat.x+dx,nextY=cat.y+dy;
          if(!blocks.some(b=>nextX+9>b.x&&nextX-9<b.x+b.w&&cat.y+9>b.y&&cat.y-20<b.y+b.h))cat.x=nextX;
          if(!blocks.some(b=>cat.x+9>b.x&&cat.x-9<b.x+b.w&&nextY+9>b.y&&nextY-20<b.y+b.h))cat.y=nextY;
          cat.x=Math.max(20,Math.min(world.w-20,cat.x));cat.y=Math.max(26,Math.min(world.h-18,cat.y));
          memories.forEach(m=>{if(!m.got&&Math.hypot(cat.x-m.x,cat.y-m.y)<28){m.got=true;countLabel.textContent=`${memories.filter(item=>item.got).length} / 3`;chirp(660,.12);if(memories.every(item=>item.got))chirp(880,.24);}});
          if(hitCooldown===0&&drones.some(drone=>{const p=dronePosition(drone,elapsed);return Math.hypot(cat.x-p.x,cat.y-p.y)<25;})){lives--;livesLabel.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);cat.x=270;cat.y=630;hitCooldown=1.4;chirp(190,.2);if(lives===0)gameOver('lives');}
          if(active&&memories.every(m=>m.got)&&Math.hypot(cat.x-entrance.x,cat.y-entrance.y)<34)finish();}
        }
        const rect=canvas.getBoundingClientRect(),scale=Math.min(rect.width/view.w,rect.height/view.h),ox=(rect.width-view.w*scale)/2,oy=(rect.height-view.h*scale)/2;
        ctx.setTransform((devicePixelRatio||1)*scale,0,0,(devicePixelRatio||1)*scale,(devicePixelRatio||1)*ox,(devicePixelRatio||1)*oy);
        view.x=Math.max(0,Math.min(world.w-view.w,cat.x-view.w/2));view.y=Math.max(0,Math.min(world.h-view.h,cat.y-view.h/2));
        ctx.save();ctx.translate(-view.x,-view.y);drawCity(elapsed);memories.forEach(m=>drawMemory(m,elapsed));drones.forEach(drone=>drawDrone(drone,elapsed));drawCat(elapsed);ctx.restore();
        requestAnimationFrame(frame);
      }
      function musicTone(frequency,duration,waveform,volume,bus){
        const oscillator=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;
        oscillator.type=waveform;oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.035);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);oscillator.connect(gain).connect(bus);oscillator.start(now);oscillator.stop(now+duration+.04);
      }
      function startMusic(){
        audio??=new AudioContext();audio.resume();if(musicTimer!==null)return;
        musicBus=audio.createGain();musicBus.gain.setValueAtTime(.0001,audio.currentTime);musicBus.gain.exponentialRampToValueAtTime(.16,audio.currentTime+.5);musicBus.connect(audio.destination);
        const melody=[523.25,0,659.25,783.99,0,659.25,587.33,0,523.25,659.25,783.99,0,1046.5,783.99,659.25,0];
        const bass=[130.81,110,146.83,98];let step=0;
        const playStep=()=>{const note=melody[step%melody.length];if(note)musicTone(note,.24,'triangle',.18,musicBus);if(step%4===0)musicTone(bass[Math.floor(step/4)%bass.length],.58,'sine',.24,musicBus);step++;};
        playStep();musicTimer=window.setInterval(playStep,320);
      }
      function stopMusic(){
        if(musicTimer!==null){window.clearInterval(musicTimer);musicTimer=null;}
        if(musicBus){const fadingBus=musicBus;fadingBus.gain.setTargetAtTime(.0001,audio.currentTime,.08);window.setTimeout(()=>fadingBus.disconnect(),700);musicBus=null;}
      }
      function chirp(frequency,duration){if(!soundOn)return;audio??=new AudioContext();const oscillator=audio.createOscillator(),gain=audio.createGain();oscillator.frequency.value=frequency;oscillator.type='sine';gain.gain.setValueAtTime(.08,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);oscillator.connect(gain).connect(audio.destination);oscillator.start();oscillator.stop(audio.currentTime+duration);}
      function finish(){active=false;document.querySelector('#catIcon').textContent='🏠';document.querySelector('#eyebrow').textContent='VOCÊ ENCONTROU O CAMINHO';document.querySelector('#title').innerHTML='Lar, doce<br>lar de novo.';document.querySelector('#message').textContent='Mimi reconheceu o cheirinho da sua manta. A cidade parece menos enorme quando a gente sabe para onde voltar.';document.querySelector('#start').textContent='Passear mais uma vez';overlay.hidden=false;}
      function gameOver(reason){active=false;document.querySelector('#catIcon').textContent='💤';document.querySelector('#eyebrow').textContent='A CIDADE AINDA ESPERA';document.querySelector('#title').innerHTML='Vamos tentar<br>de novo?';document.querySelector('#message').textContent=reason==='time'?'O tempo acabou antes de Mimi encontrar o caminho de casa.':'Os drones encontraram Mimi três vezes. As lembranças ficam para a próxima tentativa.';document.querySelector('#start').textContent='Tentar novamente';overlay.dataset.over='true';overlay.hidden=false;}
      function resetGame(){memories.forEach(m=>m.got=false);cat.x=270;cat.y=630;countLabel.textContent='0 / 3';lives=3;timeLeft=75;hitCooldown=0;livesLabel.textContent='♥♥♥';clockLabel.textContent='75s';clockLabel.classList.remove('urgent');overlay.dataset.won='';overlay.dataset.over='';}
      function start(){if(overlay.dataset.won||overlay.dataset.over)resetGame();overlay.hidden=true;active=true;if(!soundOn){soundOn=true;const button=document.querySelector('#sound');button.textContent='♫';button.setAttribute('aria-label','Desativar música e efeitos');button.title='Desativar música e efeitos';}startMusic();}
      document.querySelector('#start').addEventListener('click',start);
      document.querySelector('#sound').addEventListener('click',event=>{soundOn=!soundOn;event.currentTarget.textContent=soundOn?'♫':'♪';event.currentTarget.setAttribute('aria-label',soundOn?'Desativar música e efeitos':'Ativar música e efeitos');event.currentTarget.title=soundOn?'Desativar música e efeitos':'Ativar música e efeitos';if(soundOn){startMusic();chirp(660,.12);}else stopMusic();});
      document.querySelector('#meow').addEventListener('click',()=>{chirp(540,.2);});
      window.addEventListener('keydown',event=>{const key=event.key.toLowerCase();if(!['arrowup','arrowdown','arrowleft','arrowright'].includes(key))return;event.preventDefault();keys.add(key);});
      window.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
      document.querySelectorAll('[data-dir]').forEach(button=>{const direction={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'}[button.dataset.dir];button.addEventListener('pointerdown',event=>{event.preventDefault();keys.add(direction);});['pointerup','pointercancel','pointerleave'].forEach(name=>button.addEventListener(name,()=>keys.delete(direction)));});
      const observer=new ResizeObserver(resize);observer.observe(canvas);resize();requestAnimationFrame(frame);
      const originalFinish=finish;finish=()=>{originalFinish();overlay.dataset.won='true';};
    })();
  </script>
